services:
  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: sessionguard_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sessionguard
      POSTGRES_USER: sessionguard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sessionguard_secret}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sessionguard -d sessionguard"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── ML Service ──────────────────────────────────────────────────────────────
  ml-service:
    build:
      context: .
      dockerfile: apps/ml-service/Dockerfile
    container_name: sessionguard_ml
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ml_models:/app/models
    environment:
      ML_MODELS_DIR: /app/models
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ── Backend ─────────────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: sessionguard_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      ml-service:
        condition: service_healthy
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://sessionguard:${POSTGRES_PASSWORD:-sessionguard_secret}@postgres:5432/sessionguard
      JWT_SECRET: ${JWT_SECRET:-change-this-to-a-strong-random-secret-min-32-chars}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-4h}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      ML_SERVICE_URL: http://ml-service:8000
    # Run migrations then seed then start
    command: >
      sh -c "
        node_modules/.bin/prisma migrate deploy --schema=prisma/schema.prisma &&
        node_modules/.bin/prisma db seed &&
        node apps/backend/dist/index.js
      "
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ── Frontend ─────────────────────────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    container_name: sessionguard_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}

volumes:
  postgres_data:
  ml_models:
